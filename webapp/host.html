<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PubQuizTerminal – Quizmaster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="terminal">
    <h1>Quizmaster</h1>
    <p class="subtitle">Raum erstellen, Quiz laden, Spieler empfangen.</p>

    <div id="create-view">
      <button id="create-button">Raum erstellen</button>
      <p class="error" id="create-error"></p>
    </div>

    <div id="room-view" class="hidden">
      <h2>Raum-Code</h2>
      <div class="room-code" id="room-code"></div>

      <h2>Beitreten unter</h2>
      <p class="join-urls" id="join-urls"></p>

      <h2>Quiz laden</h2>
      <p class="empty-hint">Einzelne Quiz-Datei (JSON) oder ganzen Ordner als Playlist.</p>
      <input type="file" id="file-input" class="hidden"
             accept=".topicquiz,.pairquiz,.sortquiz,.imagequiz,.imagemutationquiz,.title" multiple>
      <input type="file" id="folder-input" class="hidden" webkitdirectory>
      <div class="file-row">
        <button type="button" class="secondary" id="open-file-button">Datei öffnen</button>
        <button type="button" class="secondary" id="open-folder-button">Ordner öffnen</button>
      </div>
      <p class="error" id="load-error"></p>

      <h2>Playlist</h2>
      <ul class="list" id="playlist"></ul>
      <p class="empty-hint" id="playlist-empty">Noch kein Quiz geladen.</p>

      <h2>Spieler (<span id="player-count">0</span>)</h2>
      <ul class="list" id="player-list"></ul>
      <p class="empty-hint" id="players-empty">Noch keine Spieler verbunden<span class="blink">_</span></p>

      <button type="button" class="secondary" id="close-button">Raum schließen</button>
      <p class="status-line" id="status-line">bereit</p>
    </div>
  </div>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="room-protocol.js"></script>
  <script src="quiz-validation.js"></script>
  <script src="host.js"></script>
</body>
</html>
