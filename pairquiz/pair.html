<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pair Quiz - PubQuizTerminal</title>
    <link rel="stylesheet" href="pair.css">
</head>
<body>
    <div class="pair-container">
        <!-- Game View -->
        <div class="game-view" id="gameView">
            <div class="left-column" id="leftColumn">
                <!-- Left items will be populated by JavaScript -->
            </div>
            <div class="center-column" id="centerColumn">
                <!-- Matched pairs will appear here -->
            </div>
            <div class="right-column" id="rightColumn">
                <!-- Right items will be populated by JavaScript -->
            </div>
        </div>

        <!-- Result View -->
        <div class="result-view" id="resultView" style="display: none;">
            <div class="result-pairs" id="resultPairs">
                <!-- All correct pairs will be shown here -->
            </div>
        </div>
    </div>

    <script src="../sound-manager.js"></script>
    <script src="pair.js"></script>
</body>
</html>
